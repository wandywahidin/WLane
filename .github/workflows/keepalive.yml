name: keepalive

# Project Supabase gratis di-pause setelah 7 hari tanpa aktivitas.
# Satu query ringan per hari cukup untuk mencegahnya.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase (get_published_demo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/get_published_demo" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"keepalive"}'
